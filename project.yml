name: Raspberry
options:
  bundleIdPrefix: com.luruke.raspberry
  xcodeVersion: "15.0"
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_PREVIEWS: NO

targets:
  Raspberry_macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared/App
      - path: Shared/Metal
        buildPhase: none
      - path: Assets.xcassets
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Raspberry
        PRODUCT_BUNDLE_IDENTIFIER: com.raspberry.ios
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        INFOPLIST_KEY_CFBundleDisplayName: "Raspberry"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_PREVIEWS: NO

  Raspberry_iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared/App
        excludes:
          - LocalSchemeHandler.swift
      - path: Shared/Metal
      - path: Assets.xcassets
      - path: NativeAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Raspberry
        PRODUCT_BUNDLE_IDENTIFIER: com.raspberry.ios
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 3AK89L7342
        INFOPLIST_KEY_CFBundleDisplayName: "Raspberry"
        INFOPLIST_FILE: Config/iOS-Info.plist
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO

  Raspberry_iOS_UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/NativeUITests
    dependencies:
      - target: Raspberry_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raspberry.ios.uitests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 3AK89L7342
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Raspberry_iOS:
    build:
      targets:
        Raspberry_iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Raspberry_iOS_UITests
