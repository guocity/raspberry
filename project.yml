name: Raspberry
options:
  bundleIdPrefix: com.luruke.raspberry
  xcodeVersion: "15.0"
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_PREVIEWS: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  Raspberry_macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared/App
      - path: Shared/Metal
        buildPhase: none
      - path: Assets.xcassets
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Raspberry
        PRODUCT_BUNDLE_IDENTIFIER: com.luruke.raspberry.macos
        INFOPLIST_KEY_CFBundleDisplayName: "Raspberry"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_PREVIEWS: NO

  Raspberry_iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared/App
      - path: Shared/Metal
        buildPhase: none
      - path: Assets.xcassets
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Raspberry
        PRODUCT_BUNDLE_IDENTIFIER: com.luruke.raspberry.ios
        INFOPLIST_KEY_CFBundleDisplayName: "Raspberry"
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
